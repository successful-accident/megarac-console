<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="MegaRAC Console: opens the Java remote console of older AMI MegaRAC SP BMCs, with no browser and no Java Web Start">
<title>MegaRAC Console: opens the Java remote console of older AMI MegaRAC SP BMCs, with no browser and no Java Web Start</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fd"/><stop offset="1" stop-color="#e6edf7"/></linearGradient>
  <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3548"/><stop offset="1" stop-color="#151c2a"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4b8fd6"/><stop offset="0.5" stop-color="#2a6db5"/><stop offset="1" stop-color="#4b8fd6"/>
    <animate attributeName="x1" values="-1;0;-1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1;0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0ff" stop-opacity="0"/><stop offset="0.5" stop-color="#9fd0ff" stop-opacity="0.07"/><stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1b2436" stroke-opacity="0.045"/></pattern>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" fill-opacity="0.025"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/></filter>
  <clipPath id="frame"><rect x="438" y="30" width="370" height="240" rx="10"/></clipPath>
  <clipPath id="typed"><rect x="470" y="72" width="0" height="20"><animate attributeName="width" calcMode="discrete" dur="12s" repeatCount="indefinite" values="0.0;0.0;7.0;13.9;20.9;27.8;34.8;41.7;48.6;55.6;62.6;69.5;76.5;83.4;90.4;97.3;104.2;0.0" keyTimes="0.0000;0.0300;0.0380;0.0460;0.0540;0.0620;0.0700;0.0780;0.0860;0.0940;0.1020;0.1100;0.1180;0.1260;0.1340;0.1420;0.1500;0.9300"/></rect></clipPath>
</defs>
<rect width="840" height="300" rx="14" fill="url(#bg)"/>
<rect width="840" height="300" rx="14" fill="url(#grid)"/>
<ellipse cx="623.0" cy="150.0" rx="190" ry="110" fill="#4b8fd6" opacity="0.14" filter="url(#blur)">
  <animate attributeName="rx" values="190;215;190" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="cx" values="623.0;605.0;623.0" dur="9s" repeatCount="indefinite"/>
</ellipse>

<g transform="translate(40 34)">
  <rect width="64.00" height="64.00" rx="15.00" fill="url(#icon)"/>
  <rect x="14.00" y="12.00" width="36.00" height="28.00" rx="4.00" fill="none" stroke="#a9d4ff" stroke-width="2.40"/>
  <path d="M14.00 21.40H50.00M14.00 30.80H50.00" stroke="#a9d4ff" stroke-width="2.40"/>
  <circle cx="44.00" cy="17.00" r="1.70" fill="#a9d4ff"/><circle cx="44.00" cy="26.40" r="1.70" fill="#a9d4ff"/><circle cx="44.00" cy="35.80" r="1.70" fill="#a9d4ff"/>
  <rect x="24.00" y="45.50" width="16.00" height="9.50" rx="2.00" fill="none" stroke="#ffffff" stroke-width="1.40"/>
  <rect x="26.50" y="48.00" width="1.60" height="1.40" fill="#ffffff"/><rect x="29.50" y="48.00" width="1.60" height="1.40" fill="#ffffff"/><rect x="32.50" y="48.00" width="1.60" height="1.40" fill="#ffffff"/><rect x="35.50" y="48.00" width="1.60" height="1.40" fill="#ffffff"/><rect x="26.50" y="51.00" width="1.60" height="1.40" fill="#ffffff"/><rect x="29.50" y="51.00" width="1.60" height="1.40" fill="#ffffff"/><rect x="32.50" y="51.00" width="1.60" height="1.40" fill="#ffffff"/><rect x="35.50" y="51.00" width="1.60" height="1.40" fill="#ffffff"/>
</g>
<text x="40" y="132" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" letter-spacing="2.2" fill="#b5690a">AMI MEGARAC SP · JAVA KVM</text>
<text x="38" y="176" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="38" font-weight="700" letter-spacing="-1"><tspan fill="#142033">MegaRAC</tspan><tspan fill="url(#title)"> Console</tspan></text>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="15" fill="#55657e">
  <text x="40" y="208">Opens the Java remote console of older AMI</text>
  <text x="40" y="228">MegaRAC SP BMCs. No browser, no Java Web Start.</text>
</g>
<g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11"><rect x="40" y="250" width="57" height="24" rx="12" fill="#2a6db5" fill-opacity="0.09" stroke="#2a6db5" stroke-opacity="0.35"/><text x="68.5" y="266" text-anchor="middle" fill="#2a6db5">macOS</text><rect x="105" y="250" width="57" height="24" rx="12" fill="#2a6db5" fill-opacity="0.09" stroke="#2a6db5" stroke-opacity="0.35"/><text x="133.5" y="266" text-anchor="middle" fill="#2a6db5">Linux</text><rect x="170" y="250" width="71" height="24" rx="12" fill="#2a6db5" fill-opacity="0.09" stroke="#2a6db5" stroke-opacity="0.35"/><text x="205.5" y="266" text-anchor="middle" fill="#2a6db5">FreeBSD</text><rect x="249" y="250" width="71" height="24" rx="12" fill="#2a6db5" fill-opacity="0.09" stroke="#2a6db5" stroke-opacity="0.35"/><text x="284.5" y="266" text-anchor="middle" fill="#2a6db5">Windows</text></g>

<g filter="url(#shadow)"><rect x="438" y="30" width="370" height="240" rx="10" fill="#070b13"/></g>
<g clip-path="url(#frame)">
  <rect x="438" y="30" width="370" height="28" fill="#d8e0eb"/>
  <circle cx="454" cy="44" r="4.5" fill="#ef6b5f"/><circle cx="469" cy="44" r="4.5" fill="#f4bd4f"/><circle cx="484" cy="44" r="4.5" fill="#5fc66a"/>
  <text x="643.0" y="48" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" fill="#55657e">JViewer · 192.0.2.10</text>
  <rect x="438" y="58" width="370" height="212" fill="url(#scan)"/>
  <rect x="438" y="18" width="370" height="40" fill="url(#sweep)">
    <animate attributeName="y" values="18;270" dur="5s" repeatCount="indefinite"/>
  </rect>
  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5">
    <text x="456" y="86" fill="#ffb547">$</text>
    <text x="470" y="86" fill="#c4e2ff" clip-path="url(#typed)">megarac-console</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.200;0.220;0.93;1" dur="12s" repeatCount="indefinite"/>
    <text x="456" y="112" fill="#5f7594">login</text>
    <text x="514" y="112" fill="#c4e2ff">POST /rpc/WEBSES/create.asp</text>
    <text x="790" y="112" fill="#7fd8a6" text-anchor="end">ok</text>
  </g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.300;0.320;0.93;1" dur="12s" repeatCount="indefinite"/>
    <text x="456" y="134" fill="#5f7594">launch</text>
    <text x="514" y="134" fill="#c4e2ff">GET /Java/jviewer.jnlp</text>
    <text x="790" y="134" fill="#7fd8a6" text-anchor="end">token</text>
  </g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.400;0.420;0.93;1" dur="12s" repeatCount="indefinite"/>
    <text x="456" y="156" fill="#5f7594">jars</text>
    <text x="514" y="156" fill="#c4e2ff">GET /Java/release/*.jar</text>
    <text x="790" y="156" fill="#7fd8a6" text-anchor="end">cached</text>
  </g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.500;0.520;0.93;1" dur="12s" repeatCount="indefinite"/>
    <text x="456" y="178" fill="#5f7594">media</text>
    <text x="514" y="178" fill="#c4e2ff">media.c, built at install</text>
    <text x="790" y="178" fill="#7fd8a6" text-anchor="end">loaded</text>
  </g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.600;0.620;0.93;1" dur="12s" repeatCount="indefinite"/>
    <text x="456" y="200" fill="#5f7594">viewer</text>
    <text x="514" y="200" fill="#c4e2ff">Java 8 + Fit</text>
    <text x="790" y="200" fill="#ffb547" text-anchor="end">video</text>
  </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.680;0.700;0.93;1" dur="12s" repeatCount="indefinite"/>
      <text x="456" y="228" fill="#ffb547">$</text>
      <rect x="470" y="218" width="7" height="12" fill="#c4e2ff">
        <animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</g>
<rect x="438.5" y="30.5" width="369" height="239" rx="10" fill="none" stroke="#d3dce9"/>
</svg>
