#
# Builds and tests MegaRAC Console on every platform GitHub has a runner for:
# media.c against the recorded replies, and the installed launcher against a
# fake BMC. No real BMC is involved; the README's status table says which
# platforms have also been checked against one.
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8
      # The runner's own keychain blocks every access, so give the Keychain checks an
      # unlocked one, as a desktop Mac has.
      - name: an unlocked keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          security set-keychain-settings "$RUNNER_TEMP/ci.keychain-db"
          security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/ci.keychain-db"
      - name: media.c against the recorded replies
        run: test/test-media.sh "$JAVA_HOME"
      - name: the installed launcher against a fake BMC
        run: test/test-launcher.sh "$JAVA_HOME"
      - name: shellcheck
        if: matrix.os == 'ubuntu-24.04'
        run: shellcheck -s sh install.sh && shellcheck test/test-launcher.sh test/test-media.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8
      # Windows PowerShell 5.1 runs the Start-menu shortcut; PowerShell 7 may run the installer.
      - name: install.ps1 and the installed launcher against a fake BMC, Windows PowerShell 5.1
        shell: powershell
        run: test/test-windows.ps1
      - name: the same, PowerShell 7
        shell: pwsh
        run: test/test-windows.ps1
